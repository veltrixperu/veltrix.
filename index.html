<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VELTRIX | Tienda Online Perú</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fc;
      color: #15233b;
    }
    header {
      background: #102b60;
      color: white;
      padding: 22px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 34px; }
    nav {
      background: #071936;
      padding: 14px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 0 12px;
      text-decoration: none;
    }
    .hero {
      padding: 65px 20px;
      text-align: center;
      background: linear-gradient(135deg,#163e85,#071936);
      color: white;
    }
    .hero h2 { font-size: 32px; }
    .hero a {
      display: inline-block;
      background: white;
      color: #102b60;
      padding: 13px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    main { max-width: 1100px; margin: auto; padding: 25px; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 20px;
    }
    .product {
      background: white;
      padding: 24px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 4px 15px #00000012;
    }
    .product .emoji { font-size: 60px; }
    .price { color: #1255bb; font-size: 22px; font-weight: bold; }
    button {
      background: #102b60;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
    }
    footer {
      background: #071936;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>VELTRIX</h1>
    <p>Tu tienda online de confianza en Perú</p>
  </header>
  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#catalogo">Productos</a>
    <a href="#carrito">Carrito</a>
  </nav>
  <section class="hero" id="inicio">
    <h2>Descubre lo mejor en VELTRIX</h2>
    <p>Tecnología, hogar y mucho más.</p>
    <a href="#catalogo">Ver productos</a>
  </section>
  <main>
    <h2 id="catalogo">Nuestros productos</h2>
    <p>Productos de demostración</p>
    <div class="products" id="products"></div>
    <section id="carrito">
      <h2>🛒 Mi carrito</h2>
      <div id="items">Tu carrito está vacío.</div>
      <h3 id="total">Total: S/ 0.00</h3>
    </section>
  </main>
  <footer>
    VELTRIX © 2026 | Envíos a todo el Perú
  </footer>
  <script>
    const products = [
      {name:"Lámpara solar LED",price:49.90,icon:"💡"},
      {name:"Audífonos Bluetooth",price:59.90,icon:"🎧"},
      {name:"Organizador de hogar",price:35.00,icon:"🏠"},
      {name:"Soporte para celular",price:24.90,icon:"📱"}
    ];
    let cart = [];
    const container = document.getElementById("products");
    products.forEach((p,i)=>{
      const card = document.createElement("div");
      card.className = "product";
      card.innerHTML = `
        <div class="emoji">${p.icon}</div>
        <h3>${p.name}</h3>
        <p class="price">S/ ${p.price.toFixed(2)}</p>
        <button onclick="addToCart(${i})">Agregar al carrito</button>
      `;
      container.appendChild(card);
    });
    function addToCart(i){
      cart.push(products[i]);
      renderCart();
    }
    function renderCart(){
      const items = document.getElementById("items");
      items.innerHTML = "";
      cart.forEach((p,i)=>{
        const row = document.createElement("p");
        row.textContent = p.name+" - S/ "+p.price.toFixed(2)+" ";
        const remove = document.createElement("button");
        remove.textContent = "Quitar";
        remove.onclick = ()=>{cart.splice(i,1);renderCart();};
        row.appendChild(remove);
        items.appendChild(row);
      });
      if(!cart.length) items.textContent="Tu carrito está vacío.";
      const total = cart.reduce((s,p)=>s+p.price,0);
      document.getElementById("total").textContent =
        "Total: S/ "+total.toFixed(2);
    }
  </script>
</body>
</html>
